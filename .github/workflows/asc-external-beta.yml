name: ASC External Beta (group / metadata / review submit)

# 外部テスター配布の一式セットアップ。
# dry_run=true (既定) なら何が起きるかを表示するだけで ASC は変更しない。
#
# ★ 審査提出を含む。dry_run=false は反映して良いと確認できた時だけ。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true なら表示のみ。false で実際に ASC を変更し審査に提出する'
        type: boolean
        default: true
      build_number:
        description: '外部配布するビルド番号'
        required: true
        default: '85'
        type: string
      group_name:
        description: '外部テスターグループ名'
        required: true
        default: '外部テスター'
        type: string
      public_link_limit:
        description: '公開リンクの参加上限'
        required: true
        default: '10'
        type: string

concurrency:
  group: asc-external-beta
  cancel-in-progress: false

jobs:
  setup:
    name: Setup external beta distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate secrets
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_P8_KEY: ${{ secrets.ASC_P8_KEY }}
        run: |
          missing=0
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_P8_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set"; missing=1
            fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Run external beta setup
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_P8_KEY: ${{ secrets.ASC_P8_KEY }}
          ASC_APP_ID: '6766822899'
          BUILD_NUMBER: ${{ inputs.build_number }}
          GROUP_NAME: ${{ inputs.group_name }}
          PUBLIC_LINK_LIMIT: ${{ inputs.public_link_limit }}
          # 審査用連絡先。氏名と電話は App Store 審査を通っている実績値、
          # メールは運営用アドレスに揃える。
          CONTACT_FIRST_NAME: 'sou'
          CONTACT_LAST_NAME: 'kane'
          CONTACT_PHONE: '+8109082247504'
          CONTACT_EMAIL: 'gokuyou.official@gmail.com'
          FEEDBACK_EMAIL: 'gokuyou.official@gmail.com'
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          {
            echo "## External Beta Setup (dry_run=${{ inputs.dry_run }})"
            echo ""
            echo '```'
            node scripts/asc-external-beta.mjs
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
