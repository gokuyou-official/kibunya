name: ASC Release (review contact / submit)

# App Store 本審査まわりの操作。用途ごとに action で切り替える。
#
#   contact-email : 審査用連絡先のメールアドレスだけを差し替える
#   submit        : 本審査に提出する (reviewSubmissions は削除しない)
#
# どちらも既定は dry_run=true。実行には dry_run=false が必要。
#
# 必須 secrets: ASC_ISSUER_ID / ASC_KEY_ID / ASC_P8_KEY
on:
  workflow_dispatch:
    inputs:
      action:
        description: '実行する操作'
        required: true
        default: 'contact-email'
        type: choice
        options:
          - contact-email
          - submit
      version_string:
        description: '対象バージョン'
        required: true
        default: '1.0.4'
        type: string
      expect_version_id:
        description: '対象バージョンの ID (取り違え防止。不一致なら中断)'
        required: false
        default: ''
        type: string
      new_contact_email:
        description: 'action=contact-email のとき: 設定する連絡先メール'
        required: false
        default: 'gokuyou.official@gmail.com'
        type: string
      expect_build_number:
        description: 'action=submit のとき: 紐付いているはずの build 番号'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'true なら確認のみで書き込まない'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: asc-release
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.action }} (dry_run=${{ inputs.dry_run }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate secrets
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_P8_KEY: ${{ secrets.ASC_P8_KEY }}
        run: |
          missing=0
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_P8_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set"; missing=1
            fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Update review contact email
        if: ${{ inputs.action == 'contact-email' }}
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_P8_KEY: ${{ secrets.ASC_P8_KEY }}
          ASC_APP_ID: '6766822899'
          TARGET_VERSION_STRING: ${{ inputs.version_string }}
          EXPECT_VERSION_ID: ${{ inputs.expect_version_id }}
          NEW_CONTACT_EMAIL: ${{ inputs.new_contact_email }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          {
            echo "## ASC Review Contact (dry_run=${{ inputs.dry_run }})"
            echo ""
            echo '```'
            node scripts/asc-review-contact.mjs
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Submit for App Store review
        if: ${{ inputs.action == 'submit' }}
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_P8_KEY: ${{ secrets.ASC_P8_KEY }}
          ASC_APP_ID: '6766822899'
          TARGET_VERSION_STRING: ${{ inputs.version_string }}
          EXPECT_VERSION_ID: ${{ inputs.expect_version_id }}
          EXPECT_BUILD_NUMBER: ${{ inputs.expect_build_number }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          {
            echo "## ASC Submit (dry_run=${{ inputs.dry_run }})"
            echo ""
            echo '```'
            node scripts/asc-submit-version.mjs
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
