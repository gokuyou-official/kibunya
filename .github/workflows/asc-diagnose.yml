name: ASC Diagnose Version

# 「Version is not ready to be submitted yet」の原因特定用。読み取り専用。
on:
  workflow_dispatch:
    inputs:
      version_string:
        description: '診断対象バージョン'
        required: true
        default: '1.0.3'
        type: string

jobs:
  diagnose:
    name: Diagnose appStoreVersion readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate secrets
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_P8_KEY: ${{ secrets.ASC_P8_KEY }}
        run: |
          missing=0
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_P8_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set"; missing=1
            fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Fix readiness (contentRights / category)
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_P8_KEY: ${{ secrets.ASC_P8_KEY }}
          ASC_APP_ID: '6766822899'
          TARGET_VERSION_STRING: ${{ inputs.version_string }}
          DRY_RUN: 'false'
        run: |
          set -o pipefail
          {
            echo '```'
            node scripts/asc-fix-readiness.mjs
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run diagnosis
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_P8_KEY: ${{ secrets.ASC_P8_KEY }}
          ASC_APP_ID: '6766822899'
          TARGET_VERSION_STRING: ${{ inputs.version_string }}
        run: |
          set -o pipefail
          {
            echo '```'
            node scripts/asc-diagnose-version.mjs
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
