name: EAS Build iOS Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build & Submit iOS
    runs-on: ubuntu-latest
    env:
      EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it under Repo Settings → Secrets → Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        # NOTE: cache: npm を意図的に指定しない。node_modules を毎回新規生成し、
        # キャッシュ起因の stale build を防ぐ (EAS Build cache の補強)。
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build and Submit iOS production
        run: eas build --platform ios --profile production --non-interactive --auto-submit --clear-cache
