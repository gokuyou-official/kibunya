name: ASC Create App Store Version

# App Store 掲載バージョン (appStoreVersion) を新規作成する手動ワークフロー。
#
# TestFlight のプレリリーストレインとは別物で、掲載メタデータ
# (説明文・スクリーンショット等) を持つのはこちら。作成すると ASC が
# 直前のバージョンからメタデータを複製する。
#
# 既定は dry_run=true (既存バージョンの一覧表示のみ)。
# 同じ versionString が既にあれば作成せず終了する (冪等)。
#
# 必須 secrets: ASC_ISSUER_ID / ASC_KEY_ID / ASC_P8_KEY
on:
  workflow_dispatch:
    inputs:
      version_string:
        description: '作成するバージョン文字列 (例 1.0.4)'
        required: true
        default: '1.0.4'
        type: string
      dry_run:
        description: 'true なら確認のみで作成しない'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  create-version:
    name: Create appStoreVersion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate secrets
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_P8_KEY: ${{ secrets.ASC_P8_KEY }}
        run: |
          missing=0
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_P8_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set"; missing=1
            fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create version
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_P8_KEY: ${{ secrets.ASC_P8_KEY }}
          ASC_APP_ID: '6766822899'
          VERSION_STRING: ${{ inputs.version_string }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          {
            echo "## Create App Store Version"
            echo ""
            echo "- version_string: \`${VERSION_STRING}\`"
            echo "- dry_run: \`${DRY_RUN}\`"
            echo ""
            echo '```'
            node scripts/asc-create-version.mjs
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
